      tags:
        - "Workers"
    put:
      operationId: "WorkersController_updateMyProfile"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkerProfileDto"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerProfileResponseDto"
        400:
          description: "Invalid profile data"
        404:
          description: "Worker, job, or zone not found"
      security:
        -
          bearer: []
      summary: "Update worker settings and synchronize job and zone references"
      tags:
        - "Workers"
  /me/earnings:
    get:
      operationId: "WorkersController_getMyEarnings"
