      security:
        -
          bearer: []
      summary: "Get an application and its status history"
      tags:
        - "Applications"
  /applications/{id}/select:
    post:
      operationId: "ApplicationsController_select"
      parameters:
        -
          name: "id"
          required: true
          in: "path"
          schema:
