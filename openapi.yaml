            - "SELECTIONNEE"
            - "CONFIRMEE"
            - "REFUSEE"
            - "EXPIREE"
            - "ANNULEE"
            - "LISTE_ATTENTE"
            - "RETIREE"
        createdAt:
          type: "string"
          format: "date-time"
        missionId:
          type: "string"
          format: "uuid"
        mission:
          type: "object"
          example: "Chantier de construction"
      required:
        - "id"
        - "statut"
        - "createdAt"
        - "missionId"
        - "mission"
    WorkerDashboardNotificationsDto:
      type: "object"
      properties:
