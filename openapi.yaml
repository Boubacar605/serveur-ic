      tags:
        - "Admin"
info:
  title: "XeuySil API"
  description: "API REST de la plateforme XeuySil (NestJS + Prisma + PostgreSQL).\n\nSupabase Auth est utilisé uniquement pour l’identité : confirmation de compte et réinitialisation de mot de passe.\n\nToutes les données métier sont stockées dans PostgreSQL et les photos de profil dans le bucket Supabase `pictureProfile`.\n\nLes réponses `photoUrl` renvoient toujours une URL : l’avatar par défaut `/avatars/default.svg` est utilisé quand aucune photo n’a été fournie."
  version: "1.0.0"
  contact:
    name: "XeuySil Platform Team"
    url: ""
    email: "platform@xeuysil.com"
tags:
  -
    name: "Auth"
    description: "Inscription, connexion, mot de passe et session utilisateur."
  -
    name: "Bootstrap"
    description: "Données initiales nécessaires au démarrage du front."
  -
    name: "Reference - Jobs"
    description: "Référentiel métier centralisé et contrôlé."
  -
    name: "Reference - Zones"
    description: "Structure géographique hiérarchique."
  -
    name: "Workers"
    description: "Profil, disponibilités et activités du travailleur."
  -
    name: "Recruiters"
    description: "Profil recruteur et suivi d’activité."
  -
    name: "Agents"
    description: "Profil agent et proposition de travailleurs."
  -
    name: "Missions"
    description: "Création, publication, clôture et suivi des missions."
  -
    name: "Applications"
    description: "Candidatures, sélection, confirmation et rejet."
  -
    name: "Availability"
    description: "Disponibilités journalières et créneaux de travail."
  -
    name: "Commissions"
    description: "Commissions, paiements, soldes et restrictions."
  -
    name: "Notifications"
    description: "Notifications utilisateur et messagerie WhatsApp."
  -
    name: "Dashboard"
    description: "Indicateurs et synthèses métier par profil."
  -
    name: "Admin"
    description: "Administration système et gestion de plateforme."
  -
    name: "WhatsApp"
    description: "Webhooks et envoi de messages WhatsApp."
  -
    name: "Settings"
    description: "Paramètres globaux applicatifs."
  -
    name: "Profile"
    description: "Photo de profil et préférences utilisateur."
  -
    name: "Avatars"
    description: "Ressources statiques d’avatar par défaut."
servers:
  -
    url: "http://localhost:3000"
    description: "Local NestJS backend"
    variables: null
  -
    url: "https://api.xeuysil.com"
    description: "Production API"
    variables: null
components:
  securitySchemes:
    bearer:
      scheme: "bearer"
      bearerFormat: "JWT"
      type: "http"
  schemas:
    RegisterWorkerDto:
      type: "object"
      properties:
        nom:
          type: "string"
        telephone:
          type: "string"
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
          format: "password"
          minLength: 8
        confirmationPassword:
          type: "string"
          format: "password"
          minLength: 8
        agentReferralCode:
          type: "object"
          nullable: true
        langue:
          type: "string"
          example: "fr"
      required:
        - "nom"
        - "telephone"
        - "email"
        - "password"
        - "confirmationPassword"
        - "langue"
    RegisterRecruiterDto:
      type: "object"
      properties:
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
          format: "password"
          minLength: 8
        nom:
          type: "string"
        telephone:
          type: "string"
        typeRecruteur:
          type: "string"
          enum:
            - "PARTICULIER"
            - "ENTREPRISE"
        raisonSociale:
          type: "string"
      required:
        - "email"
        - "password"
        - "nom"
        - "telephone"
        - "typeRecruteur"
        - "raisonSociale"
    LoginDto:
      type: "object"
      properties:
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
          format: "password"
          minLength: 8
      required:
        - "email"
        - "password"
    RefreshTokenDto:
      type: "object"
      properties:
        refreshToken:
          type: "string"
      required:
        - "refreshToken"
    ForgotPasswordDto:
      type: "object"
      properties:
        email:
          type: "string"
          format: "email"
      required:
        - "email"
    ResetPasswordDto:
      type: "object"
      properties:
        token:
          type: "string"
        newPassword:
          type: "string"
          format: "password"
          minLength: 8
        confirmPassword:
          type: "string"
          format: "password"
          minLength: 8
      required:
        - "token"
        - "newPassword"
        - "confirmPassword"
    WorkerDashboardProfileDto:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        nom:
          type: "string"
          example: "Kouassi Jean"
        telephone:
          type: "object"
          example: "+2250701020304"
          nullable: true
        langue:
          type: "string"
          example: "fr"
        photoUrl:
          type: "string"
          format: "uri"
        scoreFiabilite:
          type: "object"
          example: 92.5
          nullable: true
        possedeSonMateriel:
          type: "boolean"
          example: true
      required:
        - "id"
        - "nom"
        - "telephone"
        - "langue"
        - "photoUrl"
        - "scoreFiabilite"
        - "possedeSonMateriel"
    WorkerDashboardStatsDto:
      type: "object"
      properties:
        scoreFiabilite:
          type: "object"
          example: 92.5
          nullable: true
        applicationsTotal:
          type: "number"
          example: 24
        applicationsPending:
          type: "number"
          example: 3
        applicationsConfirmed:
          type: "number"
          example: 5
        missionsCompleted:
          type: "number"
          example: 12
        grossRevenue:
          type: "number"
          example: 540000
        totalCommission:
          type: "number"
          example: 54000
        paidCommission:
          type: "number"
          example: 0
        remainingCommission:
          type: "number"
          example: 54000
        accountRestricted:
          type: "boolean"
          example: false
        netRevenue:
          type: "number"
          example: 486000
      required:
        - "scoreFiabilite"
        - "applicationsTotal"
        - "applicationsPending"
        - "applicationsConfirmed"
        - "missionsCompleted"
        - "grossRevenue"
        - "totalCommission"
        - "paidCommission"
        - "remainingCommission"
        - "accountRestricted"
        - "netRevenue"
    WorkerDashboardMissionDto:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        description:
          type: "object"
          example: "Chantier de construction"
        dateMission:
          type: "string"
          format: "date"
          example: "2027-01-15"
        metier:
          type: "string"
          example: "Maçon"
        zone:
          type: "string"
          example: "Cocody"
        statut:
          type: "string"
          enum:
            - "PROPOSEE"
            - "INTERESSE"
            - "SELECTIONNEE"
            - "CONFIRMEE"
            - "REFUSEE"
            - "EXPIREE"
            - "ANNULEE"
            - "LISTE_ATTENTE"
            - "RETIREE"
      required:
        - "id"
        - "description"
        - "dateMission"
        - "metier"
        - "zone"
        - "statut"
    WorkerDashboardApplicationDto:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        statut:
          type: "string"
          enum:
            - "PROPOSEE"
