openapi: "3.0.0"
paths:
  /auth/register/worker:
    post:
      operationId: "AuthController_registerWorker"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWorkerDto"
      responses:
        201:
          description: "Worker account created"
        400:
          description: "Invalid registration data"
        404:
          description: "Agent referral code not found"
        409:
          description: "Email or phone already exists"
      summary: "Register a worker through Supabase Auth"
      tags:
        - "Auth"
  /auth/register/recruiter:
    post:
      operationId: "AuthController_registerRecruiter"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRecruiterDto"
      responses:
        201:
          description: "Recruiter account created"
        400:
          description: "Invalid registration data"
        409:
          description: "Email or phone already exists"
      summary: "Register a recruiter through Supabase Auth"
      tags:
        - "Auth"
  /auth/login:
    post:
      operationId: "AuthController_login"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        200:
          description: "Access and refresh tokens"
        401:
          description: "Invalid credentials"
      summary: "Authenticate through Supabase Auth"
      tags:
        - "Auth"
  /auth/logout:
    post:
      operationId: "AuthController_logout"
      parameters:
        -
          name: "authorization"
          required: true
          in: "header"
          schema:
            type: "string"
      responses:
        200:
          description: "Session revoked"
        401:
          description: "Missing or invalid access token"
      security:
        -
          bearer: []
      summary: "Revoke the current Supabase session"
      tags:
        - "Auth"
  /auth/refresh:
    post:
      operationId: "AuthController_refresh"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenDto"
      responses:
        200:
          description: "New access and refresh tokens"
        401:
          description: "Invalid or expired refresh token"
      summary: "Refresh a Supabase session"
      tags:
        - "Auth"
  /auth/forgot-password:
    post:
      operationId: "AuthController_forgotPassword"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordDto"
      responses:
        200:
          description: "Password reset request accepted"
        400:
          description: "Invalid email"
      summary: "Send a password reset email"
      tags:
        - "Auth"
  /auth/reset-password:
    post:
      operationId: "AuthController_resetPassword"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordDto"
      responses:
        200:
          description: "Password updated"
        400:
          description: "Invalid recovery token or password confirmation"
      summary: "Set a new password using a recovery token"
      tags:
        - "Auth"
  /auth/me:
    get:
      operationId: "AuthController_me"
      parameters: []
      responses:
        200:
          description: "Authenticated profile"
        401:
          description: "Missing or invalid access token"
      security:
        -
          bearer: []
      summary: "Get the authenticated XeuySil profile"
      tags:
        - "Auth"
  /avatars/default.svg:
    get:
      operationId: "AvatarController_getDefaultAvatar"
      parameters: []
      responses:
        200:
          description: "Default avatar SVG"
          content:
            "image/svg+xml":
              schema:
                type: "string"
      summary: "Default profile avatar served when a user has no uploaded picture"
      tags:
        - "Avatars"
  /bootstrap:
    get:
      operationId: "BootstrapController_getBootstrap"
      parameters: []
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponseDto"
              example:
                user:
                  id: "c3ac3a1a-2db1-4ef2-a058-7a2c31d1ad61"
                  email: "worker@example.com"
                  nom: "Kouassi Jean"
                  telephone: "+2250701020304"
                  role: "TRAVAILLEUR"
                  statut: "ACTIF"
                  langue: "fr"
                  photoUrl: null
                permissions:
                  - "dashboard:read"
                  - "profile:read"
                  - "applications:create"
                notifications:
                  unreadCount: 2
                dashboard:
                  role: "TRAVAILLEUR"
                  profile:
                    id: "c3ac3a1a-2db1-4ef2-a058-7a2c31d1ad61"
                    nom: "Kouassi Jean"
                    telephone: "+2250701020304"
                    langue: "fr"
                    scoreFiabilite: 92.5
                    possedeSonMateriel: true
                  stats:
                    scoreFiabilite: 92.5
                    applicationsTotal: 24
                    applicationsPending: 3
                    applicationsConfirmed: 5
                    missionsCompleted: 12
                    grossRevenue: 540000
                    totalCommission: 54000
                    netRevenue: 486000
                  upcomingMissions: []
                  recentApplications: []
                  notifications:
                    unreadCount: 2
                settings:
                  commissionPercent: 10
      security:
        -
          bearer: []
      summary: "Load the authenticated user application context"
      tags:
        - "Bootstrap"
  /dashboard:
    get:
      operationId: "DashboardController_getDashboard"
      parameters: []
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: "#/components/schemas/WorkerDashboardDto"
                  -
                    $ref: "#/components/schemas/RecruiterDashboardDto"
                  -
                    $ref: "#/components/schemas/AgentDashboardDto"
                  -
                    $ref: "#/components/schemas/AdminDashboardDto"
      security:
        -
          bearer: []
      summary: "Get the role-specific dashboard for the authenticated user"
      tags:
        - "Dashboard"
  /reference/jobs:
    get:
      operationId: "MetiersController_list"
      parameters: []
      responses:
        200:
          description: "Active job references"
      summary: "List active job references"
      tags:
        - "Reference - Jobs"
  /reference/jobs/{id}:
    get:
      operationId: "MetiersController_getById"
      parameters:
        -
          name: "id"
          required: true
          in: "path"
          schema:
            type: "string"
      responses:
        200:
          description: "Job reference"
        404:
          description: "Job reference not found"
      summary: "Get a job reference"
      tags:
        - "Reference - Jobs"
  /reference/zones:
    get:
      operationId: "ZonesController_list"
      parameters: []
      responses:
        200:
          description: "Geographic zone references"
      summary: "List geographic zone references"
      tags:
        - "Reference - Zones"
  /reference/zones/{id}:
    get:
      operationId: "ZonesController_getById"
      parameters:
        -
          name: "id"
          required: true
          in: "path"
          schema:
            type: "string"
      responses:
        200:
          description: "Geographic zone"
        404:
          description: "Zone not found"
      summary: "Get a geographic zone with its parent and children"
      tags:
        - "Reference - Zones"
  /me/profile:
    get:
      operationId: "WorkersController_getMyProfile"
      parameters: []
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerProfileResponseDto"
              example:
                id: "c3ac3a1a-2db1-4ef2-a058-7a2c31d1ad61"
                nom: "Kouassi Jean"
                telephone: "+2250701020304"
                langue: "fr"
                scoreFiabilite: 92.5
                possedeSonMateriel: true
                agent:
                  id: "c3ac3a1a-2db1-4ef2-a058-7a2c31d1ad63"
                  nom: "Awa Traoré"
                  codeParrainage: "AGENT-001"
                metiers:
                  -
                    id: "c3ac3a1a-2db1-4ef2-a058-7a2c31d1ad64"
                    code: "MACON"
                    libelle: "Maçon"
                    categorie: "BTP"
                    experienceAnnees: 4
                zones:
