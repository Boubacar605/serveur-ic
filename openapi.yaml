        200:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationListDto"
              example:
                data: []
                page: 1
                limit: 20
                total: 0
                totalPages: 0
      security:
        -
          bearer: []
      summary: "List applications belonging to the current worker or recruiter"
      tags:
        - "Applications"
  /applications/{id}:
