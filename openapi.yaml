          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProposalResponseDto"
        403:
          description: "Worker is not managed by this agent"
        404:
          description: "Agent, worker, or mission not found"
        409:
          description: "Mission closed or worker already proposed"
      security:
        -
          bearer: []
      summary: "Propose a mission to a managed worker"
