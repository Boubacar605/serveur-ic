          name: "metierId"
          required: false
          in: "query"
          schema:
            format: "uuid"
            type: "string"
        -
          name: "zoneId"
          required: false
          in: "query"
          schema:
            format: "uuid"
            type: "string"
        -
          name: "urgente"
